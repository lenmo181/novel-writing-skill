name: verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        # v7.45：回归套件 230+ 项，按测试文件体积贪心分 3 片并行，CI 墙钟时间约降为 1/3
        shard: ["1/3", "2/3", "3/3"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile tools
        run: python -m compileall -q tools

      - name: Lint skill
        run: python tools/lint_skill.py

      - name: Check references
        run: python tools/check_refs.py

      - name: Validate evaluation matrix
        run: python tools/eval_skill.py --json

      - name: Doctor
        run: python tools/doctor.py --runtime-smoke --package-smoke

      - name: Regression tests (shard ${{ matrix.shard }})
        run: python -W error tools/run_tests.py --shard ${{ matrix.shard }}
