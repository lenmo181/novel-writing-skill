name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile tools
        run: python -m compileall -q tools

      - name: Lint skill
        run: python tools/lint_skill.py

      - name: Check references
        run: python tools/check_refs.py

      - name: Validate evaluation matrix
        run: python tools/eval_skill.py --json

      - name: Doctor
        run: python tools/doctor.py --runtime-smoke --package-smoke

      - name: Regression tests
        run: python -W error -m unittest discover -s tests -p "test_*.py"
