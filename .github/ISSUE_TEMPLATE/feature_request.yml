name: Feature request
description: 提议新增能力或工程改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前工作流中的具体缺口。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述输入、输出、权限边界和失败行为。
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 安全边界
      options:
        - label: 不要求默认把正文发送给第三方服务
          required: true
        - label: 涉及写入时可以提供备份/回滚路径
          required: true
