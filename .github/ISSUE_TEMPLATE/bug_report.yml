name: Bug report
description: 报告可复现的工具或规则问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认没有提交 API Key、密码、未公开小说正文或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: 技能版本
      description: 例如 v7.38
      placeholder: v7.38
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 给出最小输入、命令和实际结果。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 请删除 Key、路径中的个人信息和未公开正文。
    validations:
      required: false
