<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Web Novel Writing Validator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2f4a"/>
      <stop offset="100%" stop-color="#171a2b"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc46b"/>
      <stop offset="100%" stop-color="#f08a3c"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="#3d4368" stroke-width="2"/>

  <!-- 书稿 -->
  <rect x="30" y="30" width="52" height="68" rx="6" fill="#f4f1e8"/>
  <rect x="30" y="30" width="10" height="68" rx="5" fill="#d9d3c4"/>
  <g fill="#9aa1b8">
    <rect x="47" y="44" width="28" height="4" rx="2"/>
    <rect x="47" y="55" width="28" height="4" rx="2"/>
    <rect x="47" y="66" width="20" height="4" rx="2"/>
    <rect x="47" y="77" width="24" height="4" rx="2"/>
  </g>

  <!-- 校验对勾 -->
  <circle cx="92" cy="88" r="20" fill="url(#ink)"/>
  <path d="M83 88.5 L89.5 95 L101.5 81.5" fill="none" stroke="#171a2b" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
